<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>Chat - Say hello</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script ></script>
  </head>
  <body>
    <main class="page">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true">C</div>
        <span>smalltalk</span>
      </header>

      <section class="chat-card" aria-labelledby="page-title">
        <div class="card-heading">
          <p class="eyebrow">A little corner of the internet</p>
          <h1 id="page-title">Good conversations start here.</h1>
          <p class="intro">Pick a name and join the room. Anyone with this page open can chat.</p>
        </div>

        <form id="join-form" class="join-form">
          <label for="name-input">Your name</label>
          <div class="join-row">
            <input
              id="name-input"
              name="name"
              type="text"
              maxlength="32"
              placeholder="e.g. Alex"
              autocomplete="nickname"
              required
            >
            <button type="submit">Join chat <span aria-hidden="true">→</span></button>
          </div>
          <p id="join-status" class="form-status" role="status"></p>
        </form>

        <section id="chat-panel" class="chat-panel" aria-label="Chat room" hidden>
          <div class="room-heading">
            <div>
              <p class="eyebrow">Open room</p>
              <h2>Lobby</h2>
            </div>
            <p class="connection"><span class="status-dot"></span><span id="connection-status">Connecting</span></p>
          </div>

          <ol id="messages" class="messages" aria-label="Messages" aria-live="polite">
            <li id="empty-state" class="empty-state">No messages yet. Start the conversation!</li>
          </ol>

          <form id="message-form" class="message-form">
            <label class="sr-only" for="message-input">Write a message</label>
            <input
              id="message-input"
              name="message"
              type="text"
              maxlength="500"
              placeholder="Write a message..."
              autocomplete="off"
              required
              disabled
            >
            <button id="send-button" type="submit" aria-label="Send message" disabled>
              <span aria-hidden="true">↑</span>
            </button>
          </form>
          <p id="chat-status" class="form-status" role="status"></p>
        </section>
      </section>

      <p class="page-note">A simple shared room · Messages are not saved</p>
    </main>
  </body>
</html>
